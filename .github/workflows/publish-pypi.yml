name: Publicar no PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Testes antes da publicação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rodar testes
        run: python -m pytest -v

  publish:
    name: Build e publicação
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/dados-abertos-setor-eletrico

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Gerar distribuições
        run: python -m build

      - name: Validar distribuições
        run: python -m twine check dist/*

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1